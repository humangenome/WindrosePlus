name: Release

# Triggered by pushing a version tag (v1.0.1, v1.1.0, etc.).
# Master commits alone do not build a release — only tagged versions do.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windrose-heal:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/windrose-heal -> target

      - name: Test windrose-heal
        run: cargo test --locked --manifest-path tools/windrose-heal/Cargo.toml

      - name: Dashboard server tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/Test-DashboardServer.ps1

      - name: Dashboard server tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/Test-DashboardServer.ps1

      - name: Tile build tests
        shell: powershell
        run: ./scripts/Test-TileBuild.ps1

      - name: Build windrose-heal
        run: cargo build --release --locked --manifest-path tools/windrose-heal/Cargo.toml

      - name: Upload windrose-heal artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windrose-heal-windows
          path: tools/windrose-heal/target/release/windrose-heal.exe

  build-and-release:
    needs: build-windrose-heal
    runs-on: ubuntu-latest

    env:
      # Pinned tool versions. Bump here (and rerun the release tag) to upgrade.
      REPAK_VERSION: "0.2.3"
      RETOC_VERSION: "0.1.5"
      CPP_MOD_ASSET_TAG: "cppmods-v1.3.11"
      HEIGHTMAP_EXPORTER_SHA256: "238fc6e44955d1467cf03d91897135a2bb17a6cfff7231ca3c14232357f77d54"
      WINDROSE_NATIVE_PROBE_SHA256: "1b90bf01425d43252bc27e94f7843b60d3fe59dd486739cb2eda1e5eb7dea072"
      WINDROSE_PLUS_NATIVE_SHA256: "66fb9a72724385a4ba530c5d6c3201db6a5825342b96a677240acbdcff40f6c5"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check route list and PAK builder version
        shell: pwsh
        run: |
          # The previous release's routes.json, so a route change without a higher routes_version fails.
          $prev = ''
          $tag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($tag) {
            $text = git show "${tag}:server/routes.json" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $prev = Join-Path $env:RUNNER_TEMP 'previous-routes.json'
              $text | Set-Content -LiteralPath $prev
            }
          }
          ./scripts/Test-ReleaseMetadata.ps1 -PreviousRoutes $prev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/Test-ReleaseMetadata.Tests.ps1

      - name: Curve table reader tests
        shell: pwsh
        run: ./scripts/Test-CurveTableParser.ps1

      - name: INI number format tests
        shell: pwsh
        run: ./scripts/Test-IniNumbers.ps1

      - name: Offline Lua tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          lua5.4 scripts/test-lua/run.lua

      - name: Dashboard game-watch tests
        shell: pwsh
        run: ./scripts/Test-DashboardGameWatch.ps1

      - name: Download and verify repak
        working-directory: /tmp
        run: |
          ASSET="repak_cli-x86_64-pc-windows-msvc.zip"
          URL="https://github.com/trumank/repak/releases/download/v${REPAK_VERSION}/${ASSET}"
          curl -fsSL "$URL" -o "$ASSET"
          curl -fsSL "${URL}.sha256" -o "${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          mkdir -p repak-extracted
          unzip -o "$ASSET" -d repak-extracted
          mkdir -p "$GITHUB_WORKSPACE/tools/bin"
          find repak-extracted -name 'repak.exe' -exec cp {} "$GITHUB_WORKSPACE/tools/bin/repak.exe" \;
          test -f "$GITHUB_WORKSPACE/tools/bin/repak.exe"

      - name: Download and verify retoc
        working-directory: /tmp
        run: |
          ASSET="retoc_cli-x86_64-pc-windows-msvc.zip"
          URL="https://github.com/trumank/retoc/releases/download/v${RETOC_VERSION}/${ASSET}"
          curl -fsSL "$URL" -o "$ASSET"
          curl -fsSL "${URL}.sha256" -o "${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          mkdir -p retoc-extracted
          unzip -o "$ASSET" -d retoc-extracted
          find retoc-extracted -name 'retoc.exe' -exec cp {} "$GITHUB_WORKSPACE/tools/bin/retoc.exe" \;
          test -f "$GITHUB_WORKSPACE/tools/bin/retoc.exe"

      - name: Write tool VERSION and license files
        run: |
          {
            printf 'repak=%s\n' "$REPAK_VERSION"
            printf 'retoc=%s\n' "$RETOC_VERSION"
            printf 'built=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > tools/bin/VERSION.txt
          curl -fsSL "https://raw.githubusercontent.com/trumank/repak/v${REPAK_VERSION}/LICENSE-MIT"    -o tools/bin/LICENSE-repak-MIT.txt    || true
          curl -fsSL "https://raw.githubusercontent.com/trumank/repak/v${REPAK_VERSION}/LICENSE-APACHE" -o tools/bin/LICENSE-repak-APACHE.txt || true
          curl -fsSL "https://raw.githubusercontent.com/trumank/retoc/v${RETOC_VERSION}/LICENSE"        -o tools/bin/LICENSE-retoc.txt       || true

      - name: Fetch prebuilt C++ mod DLLs
        # C++ mods ship as source in-repo but build against the UE4SS SDK,
        # whose deps/first/Unreal submodule is a private fork of Unreal Engine
        # source gated behind Epic's licensed GitHub org — a public CI runner
        # can't clone it. Prebuilt DLLs are attached to GitHub releases as
        # standalone assets and fetched here. Asset tag and hashes are pinned
        # so release ZIP contents cannot change because "latest" moved or a
        # release asset was replaced.
        run: |
          mkdir -p cpp-mods/HeightmapExporter cpp-mods/WindroseNativeProbe cpp-mods/WindrosePlusNative
          curl -fsSL "https://github.com/humangenome/WindrosePlus/releases/download/${CPP_MOD_ASSET_TAG}/HeightmapExporter.dll" \
            -o cpp-mods/HeightmapExporter/HeightmapExporter.dll
          echo "${HEIGHTMAP_EXPORTER_SHA256}  cpp-mods/HeightmapExporter/HeightmapExporter.dll" | sha256sum -c -
          curl -fsSL "https://github.com/humangenome/WindrosePlus/releases/download/${CPP_MOD_ASSET_TAG}/WindroseNativeProbe.dll" \
            -o cpp-mods/WindroseNativeProbe/WindroseNativeProbe.dll
          echo "${WINDROSE_NATIVE_PROBE_SHA256}  cpp-mods/WindroseNativeProbe/WindroseNativeProbe.dll" | sha256sum -c -
          curl -fsSL "https://github.com/humangenome/WindrosePlus/releases/download/${CPP_MOD_ASSET_TAG}/WindrosePlusNative.dll" \
            -o cpp-mods/WindrosePlusNative/WindrosePlusNative.dll
          echo "${WINDROSE_PLUS_NATIVE_SHA256}  cpp-mods/WindrosePlusNative/WindrosePlusNative.dll" | sha256sum -c -

      - name: Download windrose-heal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windrose-heal-windows
          path: tools/windrose-heal

      - name: Stamp release version into source
        # The Lua VERSION constant (reported by `wp.version` and stamped into
        # RCON status) and the start-script $Version banner are rewritten
        # here from the git tag so they cannot drift between releases. Any
        # literal in these two files is treated as a development placeholder.
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Stamping version $TAG"
          # Lua main.lua: VERSION = "X.Y.Z",
          sed -i -E 's/^(\s*VERSION\s*=\s*)"[^"]*"(,)$/\1"'"$TAG"'"\2/' WindrosePlus/Scripts/main.lua
          # PowerShell start script: $Version = "X.Y.Z"
          sed -i -E 's/^\$Version\s*=\s*"[^"]*"$/$Version = "'"$TAG"'"/' server/windrose_plus_server.ps1
          echo "--- main.lua VERSION line ---"
          grep -n 'VERSION = ' WindrosePlus/Scripts/main.lua | head -1
          echo "--- windrose_plus_server.ps1 \$Version line ---"
          grep -n '^\$Version = ' server/windrose_plus_server.ps1 | head -1
          # Hard-fail if either file did not end up with the expected tag,
          # so a future refactor that renames the constant is caught here
          # rather than shipping an incorrectly-stamped zip.
          grep -q "VERSION = \"$TAG\"" WindrosePlus/Scripts/main.lua
          grep -q "^\$Version = \"$TAG\"$" server/windrose_plus_server.ps1

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          NOTES_FILE="$(mktemp)"
          awk -v tag="$TAG" '
            $0 ~ "^## \\["tag"\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG section found for v$TAG" >&2
            exit 1
          fi
          {
            cat "$NOTES_FILE"
            echo
            echo "## Install / Upgrade"
            echo
            echo "Download \`WindrosePlus.zip\`, extract into your Windrose Dedicated Server folder, run \`install.ps1\`. Reinstalling is safe: your configs and custom mods are preserved. See [the installation guide](https://github.com/HumanGenome/WindrosePlus#installation) for details."
            echo
            echo "## Rent a server"
            echo
            echo "[Rent a Windrose server](https://www.survivalservers.com/services/game_servers/windrose/?utm_source=github&utm_medium=release_notes&utm_campaign=windrose_plus). Survival Servers game servers come with Windrose+ already installed."
          } > release_notes.md

      - name: Stage release tree
        run: |
          mkdir -p staging
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='CHANGELOG.md' \
            --exclude='CONTRIBUTING.md' \
            --exclude='/scripts/' \
            --exclude='staging' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='cpp-mods/RE-UE4SS' \
            --exclude='cpp-mods/build' \
            --exclude='tools/windrose-heal/target' \
            --exclude='tools/windrose-heal/src' \
            --exclude='tools/windrose-heal/Cargo.toml' \
            --exclude='tools/windrose-heal/Cargo.lock' \
            --exclude='docs/brand' \
            --exclude='docs/screenshots' \
            --exclude='docs/research' \
            --exclude='cpp-mods/MapMaterializerExporter' \
            --exclude='cpp-mods/*.md' \
            --exclude='cpp-mods/**/*.cpp' \
            --exclude='cpp-mods/**/*.h' \
            --exclude='CMakeLists.txt' \
            ./ staging/
          # Pictures, research notes and source stay in the repository; a server
          # needs none of them (about 8 MB the installer copied into the game folder).
          for p in docs/brand docs/screenshots docs/research tools/windrose-heal/src cpp-mods/MapMaterializerExporter; do
            if [ -e "staging/$p" ]; then echo "staging still has $p"; exit 1; fi
          done
          if find staging -name '*.cpp' -o -name 'CMakeLists.txt' | grep -q .; then echo "staging still has C++ source"; exit 1; fi
          for f in WindrosePlus/Scripts/main.lua server/windrose_plus_server.ps1 server/routes.json tools/generateTiles.ps1 install.ps1 cpp-mods/HeightmapExporter/HeightmapExporter.dll; do
            if [ ! -e "staging/$f" ]; then echo "staging is missing $f"; exit 1; fi
          done

      - name: Build zip
        working-directory: staging
        run: zip -r ../WindrosePlus.zip .

      - name: Write SHA256SUMS.txt
        run: |
          {
            sha256sum WindrosePlus.zip
            for d in HeightmapExporter WindroseNativeProbe WindrosePlusNative; do
              (cd "cpp-mods/$d" && sha256sum "$d.dll")
            done
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.HUMANGENOME_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "Windrose+ $TAG" \
            --notes-file release_notes.md \
            WindrosePlus.zip \
            cpp-mods/HeightmapExporter/HeightmapExporter.dll \
            cpp-mods/WindroseNativeProbe/WindroseNativeProbe.dll \
            cpp-mods/WindrosePlusNative/WindrosePlusNative.dll \
            SHA256SUMS.txt
