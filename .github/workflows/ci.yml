name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-syntax:
    name: PowerShell syntax
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter '*.ps1' |
            Where-Object { $_.FullName -notmatch '\\.git\\' } |
            Sort-Object FullName

          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell parse errors in $($file.FullName)"
              foreach ($err in $errors) {
                Write-Error ("  line {0}, column {1}: {2}" -f $err.Extent.StartLineNumber, $err.Extent.StartColumnNumber, $err.Message)
              }
            }
          }

          if ($failed) {
            throw "PowerShell syntax validation failed"
          }

          Write-Host "Parsed $($files.Count) PowerShell script(s)."

  lua-syntax:
    name: Lua syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      - name: Compile every Lua file
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            luac5.4 -p "$f"
            count=$((count + 1))
          done < <(find . -name '*.lua' -not -path './.git/*' -print0)
          echo "Parsed $count Lua file(s)."

      - name: Offline Lua tests
        run: lua5.4 scripts/test-lua/run.lua

  windrose-heal-tests:
    name: windrose-heal tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/windrose-heal -> target

      - name: Test windrose-heal
        run: cargo test --locked --manifest-path tools/windrose-heal/Cargo.toml

  dashboard-auth:
    name: Dashboard server and map tiles
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/Test-DashboardServer.ps1

      - name: PowerShell 7
        shell: pwsh
        run: ./scripts/Test-DashboardServer.ps1

      - name: Tile build (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/Test-TileBuild.ps1

      - name: Tile build (PowerShell 7)
        shell: pwsh
        run: ./scripts/Test-TileBuild.ps1

  release-metadata:
    name: Route list, PAK builder version, curve table reader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check route list and PAK builder version
        shell: pwsh
        run: |
          # The previous release's routes.json, so a route change without a higher routes_version fails.
          $prev = ''
          $tag = git describe --tags --abbrev=0 2>$null
          if ($tag) {
            $text = git show "${tag}:server/routes.json" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $prev = Join-Path $env:RUNNER_TEMP 'previous-routes.json'
              $text | Set-Content -LiteralPath $prev
            }
          }
          ./scripts/Test-ReleaseMetadata.ps1 -PreviousRoutes $prev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/Test-ReleaseMetadata.Tests.ps1

      - name: Curve table reader tests
        shell: pwsh
        run: ./scripts/Test-CurveTableParser.ps1

      - name: INI number format tests
        shell: pwsh
        run: ./scripts/Test-IniNumbers.ps1

      - name: Dashboard game-watch tests
        shell: pwsh
        run: ./scripts/Test-DashboardGameWatch.ps1
