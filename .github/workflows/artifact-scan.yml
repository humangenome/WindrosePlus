name: Artifact scan

# Refuses to let a published release asset carry never-publish material.
#
# Four triggers, because no single one is sufficient:
#   release        immediate feedback when a release is published or edited
#   schedule       catches an asset added to an existing release - GitHub emits NO event
#                  for an asset upload, so a release trigger alone cannot see one
#   dispatch       on demand
#   call           a release workflow's own last job scans the release it just made: a
#                  release made with the workflow's own token starts no other workflow, so
#                  the release trigger never fires for it (contents: read, no secrets)
#
# Detect only. It never deletes, edits or replaces anything.

on:
  release:
    types: [published, released, prereleased, edited, created]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to scan (blank = every release)'
        required: false
  workflow_call:
    inputs:
      tag:
        description: 'Release tag the calling release workflow just published'
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Scan published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag reaches the script below only through these two, never pasted into its text:
          # a tag name may hold $( ; and quote marks.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="${INPUT_TAG:-}"
          fi
          if [ -n "$TAG" ]; then
            # an optional name prefix (cppmods-v1.3.11), then v and a digit; no shell characters, never a leading dash
            version_tag='^([A-Za-z][A-Za-z0-9-]*-)?v[0-9][0-9A-Za-z.+-]*$'
            if ! [[ "$TAG" =~ $version_tag ]]; then
              echo "::error::The tag is not a release tag of the expected shape (an optional name and dash, then v and a digit), so nothing was scanned."
              exit 1
            fi
            TAGS=("$TAG")
          else
            # a listing that fails is a failed scan; only an empty answer means there is nothing to scan
            list=$(gh release list --limit 200 --json tagName --jq '.[].tagName') || {
              echo "::error::Could not list this repository's releases, so nothing was scanned."
              exit 1
            }
            TAGS=()
            if [ -n "$list" ]; then
              mapfile -t TAGS <<< "$list"
            fi
          fi
          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "no releases to scan"
            exit 0
          fi
          rc=0
          for tag in "${TAGS[@]}"; do
            echo "::group::$tag"
            python scripts/verify-published-artifacts.py --release "$tag" || rc=1
            echo "::endgroup::"
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::A published asset carries never-publish material. See the failing group above."
          fi
          exit $rc
